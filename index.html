<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LET Review</title>
    <style>
        :root {
            --bg-primary: #1a0b12;
            --bg-secondary: #2d1420;
            --bg-card: #3d1c2e;
            --bg-input: #2d1420;
            --border: #5a2d42;
            --border-hover: #ff6b9d;
            --text-primary: #ffe4ec;
            --text-secondary: #d4a5b5;
            --accent: #ff6b9d;
            --accent-hover: #ff8fab;
            --accent-glow: rgba(255, 107, 157, 0.3);
            --correct: #ff6b9d;
            --correct-bg: rgba(255, 107, 157, 0.15);
            --wrong: #ff4757;
            --wrong-bg: rgba(255, 71, 87, 0.15);
            --shadow: rgba(0, 0, 0, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, #0f0510 100%);
            min-height: 100vh;
            color: var(--text-primary);
            overflow-x: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(45, 20, 32, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 26px;
            font-weight: 800;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 12px;
            text-shadow: 0 0 20px var(--accent-glow);
        }

        .progress {
            font-size: 14px;
            color: var(--text-secondary);
            background: var(--bg-secondary);
            padding: 8px 18px;
            border-radius: 24px;
            border: 1px solid var(--border);
            font-weight: 600;
        }

        .main-container {
            max-width: 850px;
            margin: 0 auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .flashcard-container {
            perspective: 1200px;
            height: 300px;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .flashcard-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border: 1px solid var(--border);
            box-shadow: 0 12px 40px var(--shadow);
        }

        .flashcard-front {
            background: linear-gradient(145deg, var(--bg-secondary), var(--bg-card));
        }

        .flashcard-back {
            background: linear-gradient(145deg, var(--bg-card), #4a1f35);
            transform: rotateY(180deg);
            justify-content: flex-start;
            overflow-y: auto;
        }

        .category-tag {
            display: inline-block;
            padding: 8px 18px;
            background: linear-gradient(135deg, var(--accent), #c44569);
            color: white;
            border-radius: 24px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.3);
        }

        .question-text {
            font-size: 30px;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1.3;
            margin-bottom: 16px;
        }

        .hint-text {
            font-size: 14px;
            color: var(--text-secondary);
            font-style: italic;
        }

        .result-badge {
            display: inline-block;
            padding: 10px 24px;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 800;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .result-badge.correct {
            background: linear-gradient(135deg, var(--accent), #c44569);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.4);
        }

        .result-badge.incorrect {
            background: linear-gradient(135deg, var(--wrong), #ff6b81);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
        }

        .explanation-title {
            font-size: 24px;
            color: var(--text-primary);
            margin-bottom: 18px;
            font-weight: 700;
        }

        .explanation-content {
            text-align: left;
            width: 100%;
        }

        .rationalization-item {
            padding: 14px 18px;
            margin-bottom: 12px;
            border-radius: 12px;
            border-left: 4px solid;
            background: rgba(0,0,0,0.25);
            transition: transform 0.2s;
        }

        .rationalization-item:hover {
            transform: translateX(4px);
        }

        .rationalization-item.correct-opt {
            border-left-color: var(--accent);
            background: var(--correct-bg);
        }

        .rationalization-item.wrong-opt {
            border-left-color: var(--wrong);
            background: var(--wrong-bg);
        }

        .rationalization-item .opt-label {
            font-weight: 800;
            font-size: 14px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .rationalization-item.correct-opt .opt-label {
            color: var(--accent);
        }

        .rationalization-item.wrong-opt .opt-label {
            color: var(--wrong);
        }

        .rationalization-item .opt-rationale {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .choices-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
        }

        .choice-btn {
            width: 100%;
            padding: 20px 28px;
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .choice-btn::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 4px;
            height: 100%;
            background: transparent;
            transition: background 0.3s;
        }

        .choice-btn:hover:not(:disabled) {
            border-color: var(--accent);
            background: var(--bg-card);
            transform: translateY(-3px);
            box-shadow: 0 8px 24px var(--accent-glow);
        }

        .choice-btn:hover:not(:disabled)::before {
            background: var(--accent);
        }

        .choice-btn:disabled {
            cursor: default;
        }

        .choice-btn.correct {
            border-color: var(--accent);
            background: var(--correct-bg);
            color: var(--accent);
            box-shadow: 0 0 20px rgba(255, 107, 157, 0.2);
        }

        .choice-btn.correct::before {
            background: var(--accent);
        }

        .choice-btn.incorrect {
            border-color: var(--wrong);
            background: var(--wrong-bg);
            color: var(--wrong);
            opacity: 0.75;
        }

        .choice-btn.incorrect::before {
            background: var(--wrong);
        }

        .choice-btn.selected-wrong {
            animation: shake 0.5s ease;
            border-color: var(--wrong);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-12px); }
            40% { transform: translateX(12px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }

        .choice-indicator {
            position: absolute;
            right: 24px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 22px;
            font-weight: 800;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            margin-top: 10px;
        }

        .btn {
            padding: 14px 28px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.5px;
        }

        .btn:hover:not(:disabled) {
            background: var(--bg-card);
            border-color: var(--accent);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #c44569);
            border-color: transparent;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.3);
        }

        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--accent-hover), #d65a7e);
            box-shadow: 0 6px 20px rgba(255, 107, 157, 0.5);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: transparent;
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--wrong), #ff6b81);
            border-color: transparent;
            color: white;
        }

        .btn-danger:hover:not(:disabled) {
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 12px;
        }

        .btn-outline {
            background: transparent;
            border-style: dashed;
            border-color: var(--text-secondary);
            color: var(--text-secondary);
        }

        .btn-outline:hover:not(:disabled) {
            border-color: var(--accent);
            color: var(--accent);
        }

        .editor-panel {
            position: fixed;
            right: -420px;
            top: 0;
            width: 420px;
            height: 100vh;
            background: linear-gradient(180deg, var(--bg-secondary), var(--bg-primary));
            border-left: 1px solid var(--border);
            z-index: 100;
            transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            box-shadow: -8px 0 32px var(--shadow);
        }

        .editor-panel.open {
            right: 0;
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px;
            border-bottom: 1px solid var(--border);
            background: rgba(26, 11, 18, 0.8);
        }

        .editor-header h3 {
            color: var(--text-primary);
            font-size: 20px;
            font-weight: 800;
        }

        .editor-content {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .form-group input[type="text"],
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }

        .option-field {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
            padding: 16px;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .option-field:hover {
            border-color: var(--border-hover);
        }

        .option-field-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .option-field input[type="radio"] {
            width: 20px;
            height: 20px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .option-field input[type="text"] {
            flex: 1;
        }

        .option-field .rationale-input {
            width: 100%;
            margin-left: 32px;
        }

        .editor-actions {
            display: flex;
            gap: 12px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #c44569);
            border: none;
            color: white;
            font-size: 26px;
            cursor: pointer;
            box-shadow: 0 6px 24px rgba(255, 107, 157, 0.5);
            transition: all 0.3s;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fab:hover {
            transform: scale(1.1) rotate(90deg);
            box-shadow: 0 8px 30px rgba(255, 107, 157, 0.7);
        }

        .completion-screen {
            position: fixed;
            inset: 0;
            background: rgba(26, 11, 18, 0.97);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            backdrop-filter: blur(20px);
        }

        .completion-screen.show {
            display: flex;
        }

        .completion-content {
            text-align: center;
            padding: 50px;
            background: linear-gradient(145deg, var(--bg-secondary), var(--bg-card));
            border-radius: 24px;
            border: 1px solid var(--border);
            max-width: 520px;
            width: 90%;
            box-shadow: 0 20px 60px var(--shadow);
        }

        .completion-icon {
            font-size: 72px;
            margin-bottom: 24px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .completion-content h2 {
            font-size: 36px;
            color: var(--text-primary);
            margin-bottom: 12px;
            font-weight: 800;
        }

        .completion-content p {
            color: var(--text-secondary);
            margin-bottom: 32px;
            font-size: 16px;
        }

        .score-display {
            font-size: 56px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), #ff8fab);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 32px;
        }

        .btn-large {
            padding: 18px 36px;
            font-size: 16px;
        }

        .progress-bar-container {
            width: 100%;
            height: 4px;
            background: var(--bg-secondary);
            position: fixed;
            top: 69px;
            left: 0;
            z-index: 9;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #ff8fab);
            transition: width 0.4s ease;
            box-shadow: 0 0 10px rgba(255, 107, 157, 0.5);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state h2 {
            color: var(--accent);
            font-size: 28px;
            margin-bottom: 16px;
        }

        .question-counter {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--border);
            transition: all 0.3s;
        }

        .dot.active {
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
            transform: scale(1.3);
        }

        .dot.answered {
            background: var(--accent);
            opacity: 0.5;
        }

        .save-status {
            position: fixed;
            top: 80px;
            right: 20px;
            padding: 10px 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--accent);
            border-radius: 10px;
            color: var(--accent);
            font-size: 13px;
            font-weight: 700;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s;
            z-index: 90;
            pointer-events: none;
        }

        .save-status.show {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 640px) {
            .question-text { font-size: 22px; }
            .flashcard-container { height: 340px; }
            .editor-panel { width: 100%; right: -100%; }
            .header { padding: 16px 20px; }
            .main-container { padding: 24px 16px; }
            .choice-btn { padding: 16px 20px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">💗 FlashLearn</div>
        <div class="question-counter" id="questionCounter"></div>
    </div>

    <div class="main-container" id="mainContainer">
        <div class="flashcard-container" id="flashcardContainer">
            <div class="flashcard" id="flashcard">
                <div class="flashcard-face flashcard-front">
                    <div class="category-tag" id="categoryTag">Welcome</div>
                    <h2 class="question-text" id="questionText">Loading your flashcards...</h2>
                    <div class="hint-text" id="hintText">Select the best answer below</div>
                </div>
                <div class="flashcard-face flashcard-back">
                    <div class="result-badge" id="resultBadge">✓ Correct</div>
                    <h3 class="explanation-title" id="explanationTitle">Great job!</h3>
                    <div class="explanation-content" id="explanationContent"></div>
                </div>
            </div>
        </div>

        <div class="choices-grid" id="choicesGrid"></div>

        <div class="nav-buttons" id="navButtons">
            <button class="btn btn-secondary" id="prevBtn" onclick="prevQuestion()">← Previous</button>
            <div style="display:flex;gap:10px;">
                <button class="btn btn-outline" id="resetBtn" onclick="resetProgress()">↺ Reset</button>
                <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()">Next →</button>
            </div>
        </div>
    </div>

    <div class="editor-panel" id="editorPanel">
        <div class="editor-header">
            <h3>📝 Question Editor</h3>
            <button class="btn btn-small" onclick="toggleEditor()">✕</button>
        </div>
        <div class="editor-content">
            <div class="form-group">
                <label>Question</label>
                <input type="text" id="editQuestion" placeholder="Enter your question...">
            </div>
            <div class="form-group">
                <label>Category</label>
                <input type="text" id="editCategory" placeholder="e.g., GitHub Basics">
            </div>
            <div class="form-group">
                <label>Options — check the correct one</label>
                <div id="editOptions"></div>
                <button class="btn btn-small btn-outline" onclick="addOptionField()">+ Add Option</button>
            </div>
            <div class="editor-actions">
                <button class="btn btn-primary" onclick="saveQuestion()">💾 Save Question</button>
                <button class="btn btn-secondary" onclick="addNewQuestion()">➕ New Question</button>
                <button class="btn btn-danger" onclick="deleteCurrentQuestion()">🗑 Delete</button>
            </div>
            <div style="margin-top:20px;padding-top:20px;border-top:1px solid var(--border);">
                <button class="btn btn-outline" style="width:100%;justify-content:center;" onclick="exportQuestions()">📤 Export JSON</button>
                <button class="btn btn-outline" style="width:100%;justify-content:center;margin-top:10px;" onclick="importQuestions()">📥 Import JSON</button>
                <button class="btn btn-outline" style="width:100%;justify-content:center;margin-top:10px;color:var(--wrong);border-color:var(--wrong);" onclick="resetToDefaults()">↺ Reset to Defaults</button>
            </div>
        </div>
    </div>

    <button class="fab" onclick="toggleEditor()" title="Edit Questions">⚙️</button>

    <div class="completion-screen" id="completionScreen">
        <div class="completion-content">
            <div class="completion-icon">💗</div>
            <h2>All Done!</h2>
            <p>You've completed all the flashcards.</p>
            <div class="score-display" id="scoreDisplay"></div>
            <button class="btn btn-primary btn-large" onclick="restartQuiz()">Study Again</button>
        </div>
    </div>

    <div class="save-status" id="saveStatus">💾 Saved to browser!</div>

    <script>
        const STORAGE_KEY = 'flashlearn_questions';
        const PROGRESS_KEY = 'flashlearn_progress';

        const defaultQuestions = [
            {
                id: 1,
                category: "GitHub Basics",
                question: "What is the primary purpose of a Pull Request (PR)?",
                options: [
                    { text: "To directly push code to the main branch", correct: false, rationale: "Direct pushes to main bypass review and are generally blocked by branch protection rules. PRs exist specifically to prevent this." },
                    { text: "To propose changes and request code review before merging", correct: true, rationale: "Correct! PRs are the core collaboration feature in GitHub. They let you propose changes, discuss them with reviewers, run CI checks, and merge only when approved." },
                    { text: "To delete a repository permanently", correct: false, rationale: "Deleting a repo is done in Settings > Danger Zone. PRs are about adding code, not removing repositories." },
                    { text: "To fork a repository to your local machine", correct: false, rationale: "Forking creates a copy under your account on GitHub. Cloning copies it locally. PRs happen after you have code ready to merge." }
                ]
            },
            {
                id: 2,
                category: "Git Concepts",
                question: "What does 'git rebase' do compared to 'git merge'?",
                options: [
                    { text: "It creates a new merge commit preserving all history", correct: false, rationale: "That's what 'git merge' does. Merge preserves the exact branch history including all merge commits." },
                    { text: "It moves your branch to the tip of another branch and replays your commits", correct: true, rationale: "Correct! Rebase rewrites history by moving your branch's base commit to the target branch's tip, then replaying your changes. This creates a linear history but rewrites commit hashes." },
                    { text: "It deletes the current branch", correct: false, rationale: "'git branch -d' deletes branches. Rebase is about history manipulation, not deletion." },
                    { text: "It stashes all uncommitted changes", correct: false, rationale: "'git stash' handles uncommitted changes. Rebase works with committed changes on a branch." }
                ]
            },
            {
                id: 3,
                category: "GitHub Actions",
                question: "When does a GitHub Actions workflow trigger by default?",
                options: [
                    { text: "Only when manually clicked in the Actions tab", correct: false, rationale: "While you CAN trigger workflows manually with 'workflow_dispatch', most workflows run automatically on events." },
                    { text: "On every commit push, PR, or specified event in the YAML file", correct: true, rationale: "Correct! Workflows are event-driven. You define triggers like 'on: push', 'on: pull_request', or 'on: schedule' in your .github/workflows/*.yml file." },
                    { text: "Every day at midnight automatically", correct: false, rationale: "Scheduled triggers require explicit 'on: schedule: cron' configuration. They don't run by default." },
                    { text: "Only when the repository owner is online", correct: false, rationale: "GitHub Actions run on GitHub's cloud infrastructure, independent of anyone's online status." }
                ]
            },
            {
                id: 4,
                category: "Branching Strategy",
                question: "What is 'GitHub Flow' branching strategy?",
                options: [
                    { text: "A complex model with develop, release, and hotfix branches", correct: false, rationale: "That describes GitFlow. GitHub Flow is intentionally simpler than GitFlow." },
                    { text: "A lightweight model: create branch, commit, PR, review, merge to main", correct: true, rationale: "Correct! GitHub Flow is simple: create a feature branch from main, make commits, open a PR, get review, merge to main, deploy. Perfect for continuous deployment." },
                    { text: "A strategy that forbids any branching", correct: false, rationale: "Trunk-based development minimizes branches, but GitHub Flow explicitly uses feature branches for every change." },
                    { text: "A paid GitHub Enterprise-only feature", correct: false, rationale: "GitHub Flow is a workflow pattern, not a feature. It's free and works on any GitHub repo." }
                ]
            },
            {
                id: 5,
                category: "Security",
                question: "What should you do if you accidentally commit a secret/API key to GitHub?",
                options: [
                    { text: "Just delete the file in the next commit", correct: false, rationale: "Deleting in a new commit doesn't remove it from Git history. The secret remains visible in previous commits forever." },
                    { text: "Rewrite history to remove it, rotate the secret, and enable secret scanning", correct: true, rationale: "Correct! You must use 'git filter-repo' or BFG to rewrite history, immediately rotate/revoke the exposed credential, and enable GitHub Secret Scanning to prevent future leaks." },
                    { text: "Make the repository private temporarily", correct: false, rationale: "Making it private doesn't remove the secret from history. Anyone with prior access or forks still has it." },
                    { text: "Contact GitHub support to delete the commit", correct: false, rationale: "GitHub Support won't rewrite your history for you. You need to do it yourself or use automated tools." }
                ]
            }
        ];

        let questions = [];
        let currentIndex = 0;
        let answered = false;
        let scores = {};
        let editingId = null;

        function loadFromStorage() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    questions = JSON.parse(stored);
                    return true;
                }
            } catch (e) {
                console.error('Storage error:', e);
            }
            return false;
        }

        function saveToStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(questions));
                showSaveStatus();
            } catch (e) {
                console.error('Save error:', e);
                alert('Could not save — storage might be full or disabled.');
            }
        }

        function loadProgress() {
            try {
                const prog = localStorage.getItem(PROGRESS_KEY);
                if (prog) {
                    const data = JSON.parse(prog);
                    currentIndex = data.currentIndex || 0;
                    scores = data.scores || {};
                }
            } catch (e) {}
        }

        function saveProgress() {
            try {
                localStorage.setItem(PROGRESS_KEY, JSON.stringify({ currentIndex, scores }));
            } catch (e) {}
        }

        function showSaveStatus() {
            const el = document.getElementById('saveStatus');
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 2000);
        }

        function init() {
            if (!loadFromStorage()) {
                questions = JSON.parse(JSON.stringify(defaultQuestions));
                saveToStorage();
            }
            loadProgress();

            if (questions.length === 0) {
                showEmptyState();
                return;
            }

            renderQuestion();
            updateProgress();
            setupEditor();
            renderDots();
        }

        function showEmptyState() {
            document.getElementById('flashcardContainer').style.display = 'none';
            document.getElementById('choicesGrid').style.display = 'none';
            document.getElementById('navButtons').style.display = 'none';
            document.getElementById('mainContainer').innerHTML += `
                <div class="empty-state">
                    <h2>No questions yet!</h2>
                    <p>Click the ⚙️ button to add your first flashcard.</p>
                    <button class="btn btn-primary" style="margin-top:20px;" onclick="toggleEditor();addNewQuestion();">Create First Question</button>
                </div>
            `;
        }

        function renderDots() {
            const container = document.getElementById('questionCounter');
            if (!container) return;
            let html = `<span style="margin-right:8px;">${currentIndex + 1} / ${questions.length}</span>`;
            for (let i = 0; i < questions.length; i++) {
                const cls = i === currentIndex ? 'active' : (scores[i] !== undefined ? 'answered' : '');
                html += `<div class="dot ${cls}" onclick="jumpToQuestion(${i})" style="cursor:pointer;"></div>`;
            }
            container.innerHTML = html;
        }

        function jumpToQuestion(idx) {
            currentIndex = idx;
            answered = scores[idx] !== undefined;
            renderQuestion();
            updateProgress();
            renderDots();
            saveProgress();
        }

        function renderQuestion() {
            if (questions.length === 0) return;

            const q = questions[currentIndex];
            if (!answered) answered = scores[currentIndex] !== undefined;

            document.getElementById('categoryTag').textContent = q.category;
            document.getElementById('questionText').textContent = q.question;
            document.getElementById('hintText').textContent = answered ? 'Answered — see explanation above' : 'Select the best answer below';

            document.getElementById('flashcard').classList.remove('flipped');

            const grid = document.getElementById('choicesGrid');
            grid.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                const letter = String.fromCharCode(65 + idx);
                btn.innerHTML = `<span class="choice-letter">${letter}.</span> ${opt.text}<span class="choice-indicator"></span>`;
                
                if (answered) {
                    btn.disabled = true;
                    const correctIdx = q.options.findIndex(o => o.correct);
                    if (idx === correctIdx) {
                        btn.classList.add('correct');
                        btn.querySelector('.choice-indicator').textContent = '✓';
                    } else if (scores[currentIndex] === false && idx === findSelectedIndex(q)) {
                        btn.classList.add('incorrect', 'selected-wrong');
                        btn.querySelector('.choice-indicator').textContent = '✗';
                    } else {
                        btn.classList.add('incorrect');
                        btn.style.opacity = '0.6';
                    }
                } else {
                    btn.onclick = () => selectAnswer(idx);
                }
                grid.appendChild(btn);
            });

            if (answered) {
                showExplanation(scores[currentIndex], q);
            }

            document.getElementById('prevBtn').disabled = currentIndex === 0;
            const nextBtn = document.getElementById('nextBtn');
            nextBtn.textContent = currentIndex === questions.length - 1 ? 'Finish 💗' : 'Next →';
            nextBtn.disabled = !answered;
        }

        function findSelectedIndex(q) {
            // We don't store which wrong option was picked, so we just return first wrong for visual
            return q.options.findIndex(o => !o.correct);
        }

        function selectAnswer(selectedIdx) {
            if (answered) return;
            answered = true;

            const q = questions[currentIndex];
            const buttons = document.querySelectorAll('.choice-btn');
            const correctIdx = q.options.findIndex(o => o.correct);
            const isCorrect = selectedIdx === correctIdx;

            scores[currentIndex] = isCorrect;
            saveProgress();

            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === correctIdx) {
                    btn.classList.add('correct');
                    btn.querySelector('.choice-indicator').textContent = '✓';
                } else if (idx === selectedIdx && !isCorrect) {
                    btn.classList.add('incorrect', 'selected-wrong');
                    btn.querySelector('.choice-indicator').textContent = '✗';
                } else {
                    btn.classList.add('incorrect');
                    btn.style.opacity = '0.6';
                }
            });

            showExplanation(isCorrect, q);
            document.getElementById('nextBtn').disabled = false;
            renderDots();
        }

        function showExplanation(isCorrect, q) {
            const badge = document.getElementById('resultBadge');
            const title = document.getElementById('explanationTitle');
            const content = document.getElementById('explanationContent');

            if (isCorrect) {
                badge.textContent = '✓ Correct';
                badge.className = 'result-badge correct';
                title.textContent = 'Excellent!';
            } else {
                badge.textContent = '✗ Incorrect';
                badge.className = 'result-badge incorrect';
                title.textContent = 'Not quite right';
            }

            let html = '';
            q.options.forEach((opt, idx) => {
                const letter = String.fromCharCode(65 + idx);
                const type = opt.correct ? 'correct-opt' : 'wrong-opt';
                const icon = opt.correct ? '✓' : '✗';
                html += `
                    <div class="rationalization-item ${type}">
                        <div class="opt-label">${icon} Option ${letter}: ${opt.text}</div>
                        <div class="opt-rationale">${opt.rationale}</div>
                    </div>
                `;
            });

            content.innerHTML = html;

            setTimeout(() => {
                document.getElementById('flashcard').classList.add('flipped');
            }, 350);
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                answered = scores[currentIndex] !== undefined;
                renderQuestion();
                updateProgress();
                renderDots();
                saveProgress();
            } else {
                showCompletion();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                answered = scores[currentIndex] !== undefined;
                renderQuestion();
                updateProgress();
                renderDots();
                saveProgress();
            }
        }

        function updateProgress() {
            const pct = questions.length ? ((currentIndex + 1) / questions.length) * 100 : 0;
            let bar = document.querySelector('.progress-bar');
            if (!bar) {
                const container = document.createElement('div');
                container.className = 'progress-bar-container';
                container.innerHTML = '<div class="progress-bar"></div>';
                document.body.appendChild(container);
                bar = container.querySelector('.progress-bar');
            }
            bar.style.width = pct + '%';
        }

        function showCompletion() {
            const correct = Object.values(scores).filter(s => s).length;
            const total = questions.length;
            const pct = total ? Math.round((correct / total) * 100) : 0;

            document.getElementById('scoreDisplay').textContent = `${correct}/${total} (${pct}%)`;
            document.getElementById('completionScreen').classList.add('show');
        }

        function restartQuiz() {
            currentIndex = 0;
            scores = {};
            answered = false;
            document.getElementById('completionScreen').classList.remove('show');
            renderQuestion();
            updateProgress();
            renderDots();
            saveProgress();
        }

        function resetProgress() {
            if (!confirm('Reset your progress for this session?')) return;
            scores = {};
            currentIndex = 0;
            answered = false;
            renderQuestion();
            updateProgress();
            renderDots();
            saveProgress();
        }

        function toggleEditor() {
            const panel = document.getElementById('editorPanel');
            panel.classList.toggle('open');
            if (panel.classList.contains('open')) {
                if (questions.length > 0) {
                    loadQuestionIntoEditor(currentIndex);
                } else {
                    addNewQuestion();
                }
            }
        }

        function setupEditor() {
            if (questions.length > 0) {
                loadQuestionIntoEditor(currentIndex);
            }
        }

        function loadQuestionIntoEditor(idx) {
            if (idx < 0 || idx >= questions.length) return;
            const q = questions[idx];
            editingId = q.id;
            document.getElementById('editQuestion').value = q.question;
            document.getElementById('editCategory').value = q.category;

            const container = document.getElementById('editOptions');
            container.innerHTML = '';

            q.options.forEach((opt) => {
                addOptionField(opt.text, opt.rationale, opt.correct);
            });
        }

        function addOptionField(text = '', rationale = '', correct = false) {
            const container = document.getElementById('editOptions');
            const div = document.createElement('div');
            div.className = 'option-field';
            div.innerHTML = `
                <div class="option-field-header">
                    <input type="radio" name="correctOpt" ${correct ? 'checked' : ''} title="Mark as correct">
                    <input type="text" placeholder="Answer text" value="${text.replace(/"/g, '&quot;')}" class="opt-text" style="flex:1;">
                </div>
                <input type="text" placeholder="Why is this right or wrong? Explain the rationale..." value="${rationale.replace(/"/g, '&quot;')}" class="rationale-input">
            `;
            container.appendChild(div);
        }

        function addNewQuestion() {
            editingId = null;
            document.getElementById('editQuestion').value = '';
            document.getElementById('editCategory').value = '';
            document.getElementById('editOptions').innerHTML = '';
            addOptionField('', '', false);
            addOptionField('', '', false);
        }

        function saveQuestion() {
            const question = document.getElementById('editQuestion').value.trim();
            const category = document.getElementById('editCategory').value.trim() || 'General';

            if (!question) {
                alert('Please enter a question');
                return;
            }

            const fields = document.querySelectorAll('.option-field');
            const options = [];
            let hasCorrect = false;

            fields.forEach(field => {
                const text = field.querySelector('.opt-text').value.trim();
                const rationale = field.querySelector('.rationale-input').value.trim();
                const isCorrect = field.querySelector('input[type="radio"]').checked;

                if (text) {
                    options.push({ text, rationale: rationale || 'No explanation provided.', correct: isCorrect });
                    if (isCorrect) hasCorrect = true;
                }
            });

            if (options.length < 2) {
                alert('Please provide at least 2 options');
                return;
            }

            if (!hasCorrect) {
                alert('Please mark one option as correct');
                return;
            }

            const newQ = {
                id: editingId || Date.now(),
                category,
                question,
                options
            };

            if (editingId) {
                const idx = questions.findIndex(q => q.id === editingId);
                if (idx >= 0) questions[idx] = newQ;
            } else {
                questions.push(newQ);
                currentIndex = questions.length - 1;
            }

            saveToStorage();
            saveProgress();

            // Refresh UI
            const wasEmpty = document.querySelector('.empty-state');
            if (wasEmpty) location.reload();

            renderQuestion();
            updateProgress();
            renderDots();
            toggleEditor();
        }

        function deleteCurrentQuestion() {
            if (questions.length <= 1) {
                if (!confirm('Delete the last question? The app will show an empty state until you add new ones.')) return;
            } else {
                if (!confirm('Delete this question permanently?')) return;
            }

            questions = questions.filter(q => q.id !== editingId);
            if (currentIndex >= questions.length) currentIndex = Math.max(0, questions.length - 1);

            saveToStorage();
            saveProgress();

            if (questions.length === 0) {
                location.reload();
                return;
            }

            renderQuestion();
            updateProgress();
            renderDots();
            toggleEditor();
        }

        function resetToDefaults() {
            if (!confirm('This will ERASE all your custom questions and restore the 5 defaults. Continue?')) return;
            questions = JSON.parse(JSON.stringify(defaultQuestions));
            currentIndex = 0;
            scores = {};
            answered = false;
            saveToStorage();
            saveProgress();
            location.reload();
        }

        function exportQuestions() {
            const dataStr = JSON.stringify(questions, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'flashlearn-questions.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        function importQuestions() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const data = JSON.parse(ev.target.result);
                        if (Array.isArray(data) && data.length > 0 && data[0].question && data[0].options) {
                            questions = data;
                            currentIndex = 0;
                            scores = {};
                            answered = false;
                            saveToStorage();
                            saveProgress();
                            location.reload();
                        } else {
                            alert('Invalid format. Expected an array of question objects.');
                        }
                    } catch (err) {
                        alert('Could not parse JSON file.');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        init();
    </script>
</body>
</html>
