<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenEd LET Review</title>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <!-- KaTeX for math -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        :root {
            --bg-primary: #1a0b12;
            --bg-secondary: #2d1420;
            --bg-card: #3d1c2e;
            --bg-input: #2d1420;
            --border: #5a2d42;
            --border-hover: #ff6b9d;
            --text-primary: #ffe4ec;
            --text-secondary: #d4a5b5;
            --accent: #ff6b9d;
            --accent-hover: #ff8fab;
            --accent-glow: rgba(255, 107, 157, 0.3);
            --correct: #ff6b9d;
            --correct-bg: rgba(255, 107, 157, 0.15);
            --wrong: #ff4757;
            --wrong-bg: rgba(255, 71, 87, 0.15);
            --shadow: rgba(0, 0, 0, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, #0f0510 100%);
            min-height: 100vh;
            color: var(--text-primary);
            overflow-x: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(45, 20, 32, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 26px;
            font-weight: 800;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 12px;
            text-shadow: 0 0 20px var(--accent-glow);
        }

        .sync-status {
            font-size: 12px;
            padding: 6px 14px;
            border-radius: 20px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sync-status.online { color: #3fb950; border-color: #238636; }
        .sync-status.syncing { color: var(--accent); border-color: var(--accent); }
        .sync-status.offline { color: var(--wrong); border-color: var(--wrong); }

        .main-container {
            max-width: 850px;
            margin: 0 auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .flashcard-container {
            perspective: 1200px;
            height: 300px;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .flashcard-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border: 1px solid var(--border);
            box-shadow: 0 12px 40px var(--shadow);
        }

        .flashcard-front {
            background: linear-gradient(145deg, var(--bg-secondary), var(--bg-card));
            overflow-y: auto;
        }

        .flashcard-back {
            background: linear-gradient(145deg, var(--bg-card), #4a1f35);
            transform: rotateY(180deg);
            justify-content: flex-start;
            overflow-y: auto;
            padding: 40px;
        }

        /* Scrollbox wrapper for long questions */
        .flashcard-scrollbox {
            width: 100%;
            padding: 40px;
            margin: auto 0;
        }

        .category-tag {
            display: inline-block;
            padding: 8px 18px;
            background: linear-gradient(135deg, var(--accent), #c44569);
            color: white;
            border-radius: 24px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.3);
        }

        .question-text {
            font-size: 30px;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1.3;
            margin-bottom: 16px;
            word-break: break-word;
        }

        .question-text .katex { font-size: 1.05em; }

        .hint-text {
            font-size: 14px;
            color: var(--text-secondary);
            font-style: italic;
        }

        .result-badge {
            display: inline-block;
            padding: 10px 24px;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 800;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .result-badge.correct {
            background: linear-gradient(135deg, var(--accent), #c44569);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.4);
        }

        .result-badge.incorrect {
            background: linear-gradient(135deg, var(--wrong), #ff6b81);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
        }

        .explanation-title {
            font-size: 24px;
            color: var(--text-primary);
            margin-bottom: 18px;
            font-weight: 700;
        }

        .explanation-content {
            text-align: left;
            width: 100%;
        }

        .rationalization-item {
            padding: 14px 18px;
            margin-bottom: 12px;
            border-radius: 12px;
            border-left: 4px solid;
            background: rgba(0,0,0,0.25);
            transition: transform 0.2s;
        }

        .rationalization-item:hover {
            transform: translateX(4px);
        }

        .rationalization-item.correct-opt {
            border-left-color: var(--accent);
            background: var(--correct-bg);
        }

        .rationalization-item.wrong-opt {
            border-left-color: var(--wrong);
            background: var(--wrong-bg);
        }

        .rationalization-item .opt-label {
            font-weight: 800;
            font-size: 14px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
            word-break: break-word;
        }

        .rationalization-item.correct-opt .opt-label {
            color: var(--accent);
        }

        .rationalization-item.wrong-opt .opt-label {
            color: var(--wrong);
        }

        .rationalization-item .opt-rationale {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
            word-break: break-word;
        }

        .rationalization-item .katex { font-size: 1.05em; }

        .choices-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 14px;
        }

        .choice-btn {
            width: 100%;
            padding: 20px 28px;
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            border-radius: 14px;
            color: var(--text-primary);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: left;
            position: relative;
            overflow: hidden;
            word-break: break-word;
        }

        .choice-btn .katex { font-size: 1.05em; }

        .choice-btn::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 4px;
            height: 100%;
            background: transparent;
            transition: background 0.3s;
        }

        .choice-btn:hover:not(:disabled) {
            border-color: var(--accent);
            background: var(--bg-card);
            transform: translateY(-3px);
            box-shadow: 0 8px 24px var(--accent-glow);
        }

        .choice-btn:hover:not(:disabled)::before {
            background: var(--accent);
        }

        .choice-btn:disabled {
            cursor: default;
        }

        .choice-btn.correct {
            border-color: var(--accent);
            background: var(--correct-bg);
            color: var(--accent);
            box-shadow: 0 0 20px rgba(255, 107, 157, 0.2);
        }

        .choice-btn.correct::before {
            background: var(--accent);
        }

        .choice-btn.incorrect {
            border-color: var(--wrong);
            background: var(--wrong-bg);
            color: var(--wrong);
            opacity: 0.75;
        }

        .choice-btn.incorrect::before {
            background: var(--wrong);
        }

        .choice-btn.selected-wrong {
            animation: shake 0.5s ease;
            border-color: var(--wrong);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-12px); }
            40% { transform: translateX(12px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }

        .choice-indicator {
            position: absolute;
            right: 24px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 22px;
            font-weight: 800;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            margin-top: 10px;
        }

        .btn {
            padding: 14px 28px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.5px;
        }

        .btn:hover:not(:disabled) {
            background: var(--bg-card);
            border-color: var(--accent);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #c44569);
            border-color: transparent;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.3);
        }

        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--accent-hover), #d65a7e);
            box-shadow: 0 6px 20px rgba(255, 107, 157, 0.5);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: transparent;
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--wrong), #ff6b81);
            border-color: transparent;
            color: white;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 12px;
        }

        .btn-outline {
            background: transparent;
            border-style: dashed;
            border-color: var(--text-secondary);
            color: var(--text-secondary);
        }

        .btn-outline:hover:not(:disabled) {
            border-color: var(--accent);
            color: var(--accent);
        }

        .editor-panel {
            position: fixed;
            right: -420px;
            top: 0;
            width: 420px;
            height: 100vh;
            background: linear-gradient(180deg, var(--bg-secondary), var(--bg-primary));
            border-left: 1px solid var(--border);
            z-index: 100;
            transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            box-shadow: -8px 0 32px var(--shadow);
        }

        .editor-panel.open {
            right: 0;
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px;
            border-bottom: 1px solid var(--border);
            background: rgba(26, 11, 18, 0.8);
        }

        .editor-header h3 {
            color: var(--text-primary);
            font-size: 20px;
            font-weight: 800;
        }

        .editor-content {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .form-group input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
            font-family: inherit;
        }

        .form-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .option-field {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
            padding: 16px;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .option-field:hover {
            border-color: var(--border-hover);
        }

        .option-field-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .option-field input[type="radio"] {
            width: 20px;
            height: 20px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .option-field input[type="text"] {
            flex: 1;
        }

        .option-field .rationale-input {
            width: 100%;
            margin-left: 32px;
        }

        .editor-actions {
            display: flex;
            gap: 12px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #c44569);
            border: none;
            color: white;
            font-size: 26px;
            cursor: pointer;
            box-shadow: 0 6px 24px rgba(255, 107, 157, 0.5);
            transition: all 0.3s;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fab:hover {
            transform: scale(1.1) rotate(90deg);
            box-shadow: 0 8px 30px rgba(255, 107, 157, 0.7);
        }

        .completion-screen {
            position: fixed;
            inset: 0;
            background: rgba(26, 11, 18, 0.97);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            backdrop-filter: blur(20px);
        }

        .completion-screen.show {
            display: flex;
        }

        .completion-content {
            text-align: center;
            padding: 50px;
            background: linear-gradient(145deg, var(--bg-secondary), var(--bg-card));
            border-radius: 24px;
            border: 1px solid var(--border);
            max-width: 520px;
            width: 90%;
            box-shadow: 0 20px 60px var(--shadow);
        }

        .completion-icon {
            font-size: 72px;
            margin-bottom: 24px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .completion-content h2 {
            font-size: 36px;
            color: var(--text-primary);
            margin-bottom: 12px;
            font-weight: 800;
        }

        .completion-content p {
            color: var(--text-secondary);
            margin-bottom: 32px;
            font-size: 16px;
        }

        .score-display {
            font-size: 56px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), #ff8fab);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 32px;
        }

        .btn-large {
            padding: 18px 36px;
            font-size: 16px;
        }

        .progress-bar-container {
            width: 100%;
            height: 4px;
            background: var(--bg-secondary);
            position: fixed;
            top: 69px;
            left: 0;
            z-index: 9;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), #ff8fab);
            transition: width 0.4s ease;
            box-shadow: 0 0 10px rgba(255, 107, 157, 0.5);
        }

        .question-counter {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--border);
            transition: all 0.3s;
            cursor: pointer;
        }

        .dot.active {
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
            transform: scale(1.3);
        }

        .dot.answered {
            background: var(--accent);
            opacity: 0.5;
        }

        .password-overlay {
            position: fixed;
            inset: 0;
            background: rgba(13, 5, 10, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 300;
            backdrop-filter: blur(20px);
        }

        .password-overlay.show {
            display: flex;
        }

        .password-box {
            background: linear-gradient(145deg, var(--bg-secondary), var(--bg-card));
            padding: 40px;
            border-radius: 20px;
            border: 1px solid var(--border);
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px var(--shadow);
        }

        .password-box h3 {
            font-size: 24px;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .password-box p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .password-box input {
            width: 100%;
            padding: 14px;
            background: var(--bg-input);
            border: 2px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 16px;
            text-align: center;
            letter-spacing: 4px;
            margin-bottom: 16px;
            outline: none;
        }

        .password-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .password-error {
            color: var(--wrong);
            font-size: 13px;
            margin-top: 8px;
            height: 20px;
            font-weight: 600;
        }

        .loading-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 400;
            gap: 20px;
        }

        .loading-screen.hidden {
            display: none;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 640px) {
            .question-text { font-size: 22px; }
            .flashcard-container { height: 340px; }
            .editor-panel { width: 100%; right: -100%; }
            .header { padding: 16px 20px; flex-wrap: wrap; gap: 10px; }
            .main-container { padding: 24px 16px; }
            .choice-btn { padding: 16px 20px; }
        }
    </style>
<base target="_blank">
</head>
<body>

    <div class="loading-screen" id="loadingScreen">
        <div class="spinner"></div>
        <p style="color: var(--text-secondary);">Loading from cloud...</p>
    </div>

    <div class="header">
        <div class="logo">💗 LET Review</div>
        <div class="question-counter" id="questionCounter"></div>
        <div class="sync-status offline" id="syncStatus">● Offline</div>
    </div>

    <div class="main-container" id="mainContainer">
        <div class="flashcard-container" id="flashcardContainer">
            <div class="flashcard" id="flashcard">
                <div class="flashcard-face flashcard-front">
                    <div class="flashcard-scrollbox">
                        <div class="category-tag" id="categoryTag">Loading...</div>
                        <h2 class="question-text" id="questionText">Connecting to database...</h2>
                        <div class="hint-text" id="hintText">Please wait</div>
                    </div>
                </div>
                <div class="flashcard-face flashcard-back">
                    <div class="result-badge" id="resultBadge">✓ Correct</div>
                    <h3 class="explanation-title" id="explanationTitle">Great job!</h3>
                    <div class="explanation-content" id="explanationContent"></div>
                </div>
            </div>
        </div>

        <div class="choices-grid" id="choicesGrid"></div>

        <div class="nav-buttons" id="navButtons">
            <button class="btn btn-secondary" id="prevBtn" onclick="prevQuestion()">← Previous</button>
            <div style="display:flex;gap:10px;">
                <button class="btn btn-outline" onclick="resetProgress()">↺ Reset</button>
                <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()">Next →</button>
            </div>
        </div>
    </div>

    <div class="editor-panel" id="editorPanel">
        <div class="editor-header">
            <h3>📝 Question Editor</h3>
            <button class="btn btn-small" onclick="toggleEditor()">✕</button>
        </div>
        <div class="editor-content">
            <div class="form-group">
                <label>Question</label>
                <input type="text" id="editQuestion" placeholder="Enter your question...">
            </div>
            <div class="form-group">
                <label>Category</label>
                <input type="text" id="editCategory" placeholder="e.g., Math">
            </div>
            <div class="form-group">
                <label>Options — check the correct one</label>
                <div id="editOptions"></div>
                <button class="btn btn-small btn-outline" onclick="addOptionField()">+ Add Option</button>
            </div>
            <div class="editor-actions">
                <button class="btn btn-primary" onclick="saveQuestion()">💾 Save to Cloud</button>
                <button class="btn btn-secondary" onclick="addNewQuestion()">➕ New Question</button>
                <button class="btn btn-danger" onclick="deleteCurrentQuestion()">🗑 Delete</button>
            </div>
            <div style="margin-top:20px;padding-top:20px;border-top:1px solid var(--border);">
                <button class="btn btn-outline" style="width:100%;justify-content:center;" onclick="exportQuestions()">📤 Export JSON</button>
                <button class="btn btn-outline" style="width:100%;justify-content:center;margin-top:10px;" onclick="importQuestions()">📥 Import JSON</button>
                <button class="btn btn-outline" style="width:100%;justify-content:center;margin-top:10px;color:var(--wrong);border-color:var(--wrong);" onclick="resetToDefaults()">↺ Reset to Defaults</button>
            </div>
        </div>
    </div>

    <button class="fab" onclick="promptPassword()" title="Edit Questions">⚙️</button>

    <div class="password-overlay" id="passwordOverlay">
        <div class="password-box">
            <div style="font-size:48px;margin-bottom:12px;">🔒</div>
            <h3>Editor Locked</h3>
            <p>Enter the admin password to edit questions</p>
            <input type="password" id="passwordInput" placeholder="••••••" onkeydown="if(event.key==='Enter')checkPassword()">
            <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="checkPassword()">Unlock Editor</button>
            <div class="password-error" id="passwordError"></div>
        </div>
    </div>

    <div class="completion-screen" id="completionScreen">
        <div class="completion-content">
            <div class="completion-icon">💗</div>
            <h2>All Done!</h2>
            <p>You have completed all the flashcards.</p>
            <div class="score-display" id="scoreDisplay"></div>
            <button class="btn btn-primary btn-large" onclick="restartQuiz()">Study Again</button>
        </div>
    </div>

    <script>
        // ==================== CONFIG ====================
        const firebaseConfig = {
          apiKey: "AIzaSyARnLfkYgFa_X-efzesSOCiWoo6QijaXu0",
          authDomain: "flashcard-e8dcb.firebaseapp.com",
          projectId: "flashcard-e8dcb",
          storageBucket: "flashcard-e8dcb.firebasestorage.app",
          messagingSenderId: "942708875601",
          appId: "1:942708875601:web:e2f46e6ad3d5b98e93f370"
        };

        const ADMIN_PASSWORD = "122423";
        // ================================================

        let db;
        let questions = [];
        let currentIndex = 0;
        let answered = false;
        let scores = {};
        let editingId = null;
        let editorUnlocked = false;

        const defaultQuestions = [
            {
                id: 1,
                category: "Math Demo",
                question: "What is the derivative of $x^2$ with respect to $x$?",
                options: [
                    { text: "$x$", correct: false, rationale: "The derivative of $x^2$ is not $x$. Use the power rule: $rac{d}{dx}(x^n) = nx^{n-1}$." },
                    { text: "$2x$", correct: true, rationale: "Correct! Using the power rule: $rac{d}{dx}(x^2) = 2x^{2-1} = 2x$." },
                    { text: "$x^2$", correct: false, rationale: "The derivative reduces the exponent by 1, so it cannot stay $x^2$." },
                    { text: "$\frac{x^3}{3}$", correct: false, rationale: "That is the integral of $x^2$, not the derivative." }
                ]
            },
            {
                id: 2,
                category: "Physics Demo",
                question: "The kinetic energy of an object is given by $KE = \frac{1}{2}mv^2$. If mass $m$ doubles while velocity $v$ stays constant, what happens to $KE$?",
                options: [
                    { text: "It stays the same", correct: false, rationale: "$KE$ is directly proportional to mass. If $m$ doubles, $KE$ must change." },
                    { text: "It doubles", correct: true, rationale: "Correct! Since $KE \propto m$, doubling $m$ while keeping $v$ constant doubles the kinetic energy." },
                    { text: "It quadruples", correct: false, rationale: "That would happen if velocity doubled, not mass. $KE \propto v^2$ but only $\propto m^1$." },
                    { text: "It halves", correct: false, rationale: "Inverse relationship would mean $KE \propto \frac{1}{m}$, which is not the case." }
                ]
            },
        ];

        // ==================== MATH RENDERING ====================
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function renderMath(text) {
            if (!text || typeof text !== 'string') return text;
            let html = escapeHtml(text);

            // Display math: $$...$$
            html = html.replace(/\$\$([\s\S]+?)\$\$/g, (match, latex) => {
                try {
                    return katex.renderToString(latex.trim(), { throwOnError: false, displayMode: true });
                } catch (e) { return match; }
            });

            // Inline math: $...$
            html = html.replace(/\$([^$
]+?)\$/g, (match, latex) => {
                try {
                    return katex.renderToString(latex.trim(), { throwOnError: false, displayMode: false });
                } catch (e) { return match; }
            });

            return html;
        }

        // ==================== FIREBASE ====================
        async function initFirebase() {
            try {
                firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
                updateSyncStatus('syncing');
                await loadFromCloud();
                updateSyncStatus('online');
            } catch (err) {
                console.error('Firebase init failed:', err);
                questions = JSON.parse(JSON.stringify(defaultQuestions));
                updateSyncStatus('offline');
                alert('Could not connect to Firebase. Using default questions. Check your config values.');
            }
            document.getElementById('loadingScreen').classList.add('hidden');
            renderQuestion();
            updateProgress();
            setupEditor();
            renderDots();
        }

        function updateSyncStatus(status) {
            const el = document.getElementById('syncStatus');
            el.className = 'sync-status ' + status;
            if (status === 'online') el.textContent = '● Live';
            else if (status === 'syncing') el.textContent = '● Syncing...';
            else el.textContent = '● Offline';
        }

        async function loadFromCloud() {
            const doc = await db.collection('flashcards').doc('main').get();
            if (doc.exists && doc.data().questions) {
                questions = doc.data().questions;
            } else {
                questions = JSON.parse(JSON.stringify(defaultQuestions));
                await saveToCloud();
            }
        }

        async function saveToCloud() {
            if (!db) return;
            updateSyncStatus('syncing');
            try {
                await db.collection('flashcards').doc('main').set({
                    questions: questions,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                updateSyncStatus('online');
            } catch (err) {
                console.error('Save failed:', err);
                updateSyncStatus('offline');
                alert('Failed to save to cloud. Check Firestore rules (should be in test mode).');
            }
        }

        // ==================== PASSWORD LOCK ====================
        function promptPassword() {
            if (editorUnlocked) {
                toggleEditor();
                return;
            }
            document.getElementById('passwordOverlay').classList.add('show');
            document.getElementById('passwordInput').value = '';
            document.getElementById('passwordError').textContent = '';
            setTimeout(() => document.getElementById('passwordInput').focus(), 100);
        }

        function checkPassword() {
            const input = document.getElementById('passwordInput').value;
            if (input === ADMIN_PASSWORD) {
                editorUnlocked = true;
                document.getElementById('passwordOverlay').classList.remove('show');
                toggleEditor();
            } else {
                document.getElementById('passwordError').textContent = 'Wrong password. Try again.';
                document.getElementById('passwordInput').value = '';
                document.getElementById('passwordInput').focus();
            }
        }

        // ==================== UI RENDERING ====================
        function renderQuestion() {
            if (questions.length === 0) return;
            const q = questions[currentIndex];
            if (!answered) answered = scores[currentIndex] !== undefined;

            document.getElementById('categoryTag').textContent = q.category;
            document.getElementById('questionText').innerHTML = renderMath(q.question);
            document.getElementById('hintText').textContent = answered ? 'Answered — see explanation above' : 'Select the best answer below';
            document.getElementById('flashcard').classList.remove('flipped');

            const grid = document.getElementById('choicesGrid');
            grid.innerHTML = '';

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                const letter = String.fromCharCode(65 + idx);
                btn.innerHTML = `<span class="choice-letter">${letter}.</span> ${renderMath(opt.text)}<span class="choice-indicator"></span>`;

                if (answered) {
                    btn.disabled = true;
                    const correctIdx = q.options.findIndex(o => o.correct);
                    if (idx === correctIdx) {
                        btn.classList.add('correct');
                        btn.querySelector('.choice-indicator').textContent = '✓';
                    } else if (scores[currentIndex] === false && idx === findSelectedIndex(q)) {
                        btn.classList.add('incorrect', 'selected-wrong');
                        btn.querySelector('.choice-indicator').textContent = '✗';
                    } else {
                        btn.classList.add('incorrect');
                        btn.style.opacity = '0.6';
                    }
                } else {
                    btn.onclick = () => selectAnswer(idx);
                }
                grid.appendChild(btn);
            });

            if (answered) showExplanation(scores[currentIndex], q);

            document.getElementById('prevBtn').disabled = currentIndex === 0;
            const nextBtn = document.getElementById('nextBtn');
            nextBtn.textContent = currentIndex === questions.length - 1 ? 'Finish 💗' : 'Next →';
            nextBtn.disabled = !answered;
        }

        function findSelectedIndex(q) {
            return q.options.findIndex(o => !o.correct);
        }

        function selectAnswer(selectedIdx) {
            if (answered) return;
            answered = true;
            const q = questions[currentIndex];
            const buttons = document.querySelectorAll('.choice-btn');
            const correctIdx = q.options.findIndex(o => o.correct);
            const isCorrect = selectedIdx === correctIdx;
            scores[currentIndex] = isCorrect;

            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === correctIdx) {
                    btn.classList.add('correct');
                    btn.querySelector('.choice-indicator').textContent = '✓';
                } else if (idx === selectedIdx && !isCorrect) {
                    btn.classList.add('incorrect', 'selected-wrong');
                    btn.querySelector('.choice-indicator').textContent = '✗';
                } else {
                    btn.classList.add('incorrect');
                    btn.style.opacity = '0.6';
                }
            });

            showExplanation(isCorrect, q);
            document.getElementById('nextBtn').disabled = false;
            renderDots();
        }

        function showExplanation(isCorrect, q) {
            const badge = document.getElementById('resultBadge');
            const title = document.getElementById('explanationTitle');
            const content = document.getElementById('explanationContent');

            if (isCorrect) {
                badge.textContent = '✓ Correct';
                badge.className = 'result-badge correct';
                title.textContent = 'Excellent!';
            } else {
                badge.textContent = '✗ Incorrect';
                badge.className = 'result-badge incorrect';
                title.textContent = 'Not quite right';
            }

            let html = '';
            q.options.forEach((opt, idx) => {
                const letter = String.fromCharCode(65 + idx);
                const type = opt.correct ? 'correct-opt' : 'wrong-opt';
                const icon = opt.correct ? '✓' : '✗';
                html += `
                    <div class="rationalization-item ${type}">
                        <div class="opt-label">${icon} Option ${letter}: ${renderMath(opt.text)}</div>
                        <div class="opt-rationale">${renderMath(opt.rationale)}</div>
                    </div>
                `;
            });
            content.innerHTML = html;

            setTimeout(() => document.getElementById('flashcard').classList.add('flipped'), 350);
        }

        function nextQuestion() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                answered = scores[currentIndex] !== undefined;
                renderQuestion();
                updateProgress();
                renderDots();
            } else {
                showCompletion();
            }
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                answered = scores[currentIndex] !== undefined;
                renderQuestion();
                updateProgress();
                renderDots();
            }
        }

        function updateProgress() {
            const pct = questions.length ? ((currentIndex + 1) / questions.length) * 100 : 0;
            let bar = document.querySelector('.progress-bar');
            if (!bar) {
                const container = document.createElement('div');
                container.className = 'progress-bar-container';
                container.innerHTML = '<div class="progress-bar"></div>';
                document.body.appendChild(container);
                bar = container.querySelector('.progress-bar');
            }
            bar.style.width = pct + '%';
        }

        function renderDots() {
            const container = document.getElementById('questionCounter');
            if (!container) return;
            let html = `<span style="margin-right:8px;">${currentIndex + 1} / ${questions.length}</span>`;
            for (let i = 0; i < questions.length; i++) {
                const cls = i === currentIndex ? 'active' : (scores[i] !== undefined ? 'answered' : '');
                html += `<div class="dot ${cls}" onclick="jumpToQuestion(${i})"></div>`;
            }
            container.innerHTML = html;
        }

        function jumpToQuestion(idx) {
            currentIndex = idx;
            answered = scores[idx] !== undefined;
            renderQuestion();
            updateProgress();
            renderDots();
        }

        function showCompletion() {
            const correct = Object.values(scores).filter(s => s).length;
            const total = questions.length;
            const pct = total ? Math.round((correct / total) * 100) : 0;
            document.getElementById('scoreDisplay').textContent = `${correct}/${total} (${pct}%)`;
            document.getElementById('completionScreen').classList.add('show');
        }

        function restartQuiz() {
            currentIndex = 0;
            scores = {};
            answered = false;
            document.getElementById('completionScreen').classList.remove('show');
            renderQuestion();
            updateProgress();
            renderDots();
        }

        function resetProgress() {
            if (!confirm('Reset your progress?')) return;
            scores = {};
            currentIndex = 0;
            answered = false;
            renderQuestion();
            updateProgress();
            renderDots();
        }

        // ==================== EDITOR ====================
        function toggleEditor() {
            document.getElementById('editorPanel').classList.toggle('open');
            if (document.getElementById('editorPanel').classList.contains('open')) {
                if (questions.length > 0) loadQuestionIntoEditor(currentIndex);
                else addNewQuestion();
            }
        }

        function setupEditor() {
            if (questions.length > 0) loadQuestionIntoEditor(currentIndex);
        }

        function loadQuestionIntoEditor(idx) {
            if (idx < 0 || idx >= questions.length) return;
            const q = questions[idx];
            editingId = q.id;
            document.getElementById('editQuestion').value = q.question;
            document.getElementById('editCategory').value = q.category;
            const container = document.getElementById('editOptions');
            container.innerHTML = '';
            q.options.forEach((opt) => addOptionField(opt.text, opt.rationale, opt.correct));
        }

        function addOptionField(text = '', rationale = '', correct = false) {
            const container = document.getElementById('editOptions');
            const div = document.createElement('div');
            div.className = 'option-field';
            div.innerHTML = `
                <div class="option-field-header">
                    <input type="radio" name="correctOpt" ${correct ? 'checked' : ''} title="Mark as correct">
                    <input type="text" placeholder="Answer text" value="${text.replace(/"/g, '&quot;')}" class="opt-text" style="flex:1;">
                </div>
                <input type="text" placeholder="Why is this right or wrong? Explain the rationale..." value="${rationale.replace(/"/g, '&quot;')}" class="rationale-input">
            `;
            container.appendChild(div);
        }

        function addNewQuestion() {
            editingId = null;
            document.getElementById('editQuestion').value = '';
            document.getElementById('editCategory').value = '';
            document.getElementById('editOptions').innerHTML = '';
            addOptionField('', '', false);
            addOptionField('', '', false);
        }

        async function saveQuestion() {
            const question = document.getElementById('editQuestion').value.trim();
            const category = document.getElementById('editCategory').value.trim() || 'General';
            if (!question) { alert('Please enter a question'); return; }

            const fields = document.querySelectorAll('.option-field');
            const options = [];
            let hasCorrect = false;
            fields.forEach(field => {
                const text = field.querySelector('.opt-text').value.trim();
                const rationale = field.querySelector('.rationale-input').value.trim();
                const isCorrect = field.querySelector('input[type="radio"]').checked;
                if (text) {
                    options.push({ text, rationale: rationale || 'No explanation provided.', correct: isCorrect });
                    if (isCorrect) hasCorrect = true;
                }
            });

            if (options.length < 2) { alert('Please provide at least 2 options'); return; }
            if (!hasCorrect) { alert('Please mark one option as correct'); return; }

            const newQ = { id: editingId || Date.now(), category, question, options };
            if (editingId) {
                const idx = questions.findIndex(q => q.id === editingId);
                if (idx >= 0) questions[idx] = newQ;
            } else {
                questions.push(newQ);
                currentIndex = questions.length - 1;
            }

            await saveToCloud();
            renderQuestion();
            updateProgress();
            renderDots();
            toggleEditor();
        }

        async function deleteCurrentQuestion() {
            if (questions.length <= 1) {
                if (!confirm('Delete the last question?')) return;
            } else {
                if (!confirm('Delete this question permanently?')) return;
            }
            questions = questions.filter(q => q.id !== editingId);
            if (currentIndex >= questions.length) currentIndex = Math.max(0, questions.length - 1);
            await saveToCloud();
            if (questions.length === 0) { location.reload(); return; }
            renderQuestion();
            updateProgress();
            renderDots();
            toggleEditor();
        }

        async function resetToDefaults() {
            if (!confirm('This will ERASE all custom questions and restore defaults. Continue?')) return;
            questions = JSON.parse(JSON.stringify(defaultQuestions));
            currentIndex = 0;
            scores = {};
            answered = false;
            await saveToCloud();
            location.reload();
        }

        function exportQuestions() {
            const dataStr = JSON.stringify(questions, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'flashlearn-questions.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        function importQuestions() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    try {
                        const data = JSON.parse(ev.target.result);
                        if (Array.isArray(data) && data.length > 0 && data[0].question && data[0].options) {
                            questions = data;
                            currentIndex = 0;
                            scores = {};
                            answered = false;
                            await saveToCloud();
                            location.reload();
                        } else {
                            alert('Invalid format. Expected an array of question objects.');
                        }
                    } catch (err) { alert('Could not parse JSON file.'); }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        // Start
        initFirebase();
    </script>
</body>
</html>
